site_name: tastapi
site_description: A typed, FastAPI-style web framework for TypeScript, built on zod and the fetch API.
repo_url: https://github.com/Kludex/tastapi
repo_name: Kludex/tastapi
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

exclude_docs: |
  examples/

nav:
  - tastapi: index.md
  - Guide:
      - Routing: routing.md
      - Path parameters: path-parameters.md
      - Validation: validation.md
      - Responses: responses.md
      - Middleware and state: middleware.md
      - Errors: errors.md
      - OpenAPI: openapi.md
      - Deployment: deployment.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
